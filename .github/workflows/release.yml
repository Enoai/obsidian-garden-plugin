name: Release

# Tag a version (e.g. `git tag 0.1.0 && git push --tags`) and this builds the
# plugin and publishes a GitHub release with the three files Obsidian needs.

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            main.js manifest.json styles.css \
            --title "$tag" \
            --generate-notes
